<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon / tab icon.
         Files live in public/ and are referenced by absolute path, NOT
         imported. Anything under public/ is copied verbatim with its
         filename intact, which is what a favicon needs — Vite fingerprints
         files imported from src/, and a hashed favicon name breaks
         bookmarks and cached tab icons on every rebuild. -->
    <link rel="icon" type="image/jpeg" href="src/assets/images/logo.jpeg" />
    <link rel="apple-touch-icon" href="src/assets/images/logo.jpeg" />

    <!-- Browser chrome colour on mobile — the navy from variables.css.
         Hardcoded because index.html can't read CSS custom properties;
         if --jla-navy changes, change it here too. -->
    <meta name="theme-color" content="#0A1E4E" />

    <title>Juris Leadership Alliance</title>
    <meta name="description" content="Juris Leadership Alliance — Official Website" />

    <!-- Baseline share card. SEO.jsx overrides these per page; these are
         the fallback for any route that doesn't set its own. -->
    <meta property="og:site_name" content="Juris Leadership Alliance" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Juris Leadership Alliance" />
    <meta property="og:description" content="Where law meets leadership." />
    <meta property="og:image" content="/logo.jpeg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Typography. WITHOUT THESE THE WHOLE SITE FALLS BACK TO GEORGIA:
         variables.css sets --font-display to "Fraunces", Georgia, serif,
         so a missing font link doesn't error — every heading just quietly
         renders in the fallback and the site looks generic. If the display
         type ever stops looking right, check these three lines first. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
